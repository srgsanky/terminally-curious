<title id="title">Luxury website sample</title>
<desc id="desc">Black-green background, ivory serif typography, a thin gold frame and a restrained outlined call to action. Original mockup for the fictional productivity product Gather.</desc>

<rect x="0" y="0" width="720" height="450" rx="0" fill="#171a18" /><rect x="17" y="17" width="686" height="416" rx="0" fill="none" stroke="#7d7351" stroke-width="1" /><text x="360" y="63" fill="#d8c69a" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="400" text-anchor="middle">G A T H E R</text><line x1="50" y1="88" x2="670" y2="88" stroke="#57543d" stroke-width="1" /><text x="360" y="129" fill="#c6b586" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" text-anchor="middle" letter-spacing="3">THE LUXURY OF ATTENTION</text><text x="360" y="200" fill="#f4eee0" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="400" text-anchor="middle">Make room for</text><text x="360" y="252" fill="#f4eee0" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="400" text-anchor="middle">better work.</text><text x="360" y="290" fill="#b7b39f" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="400" text-anchor="middle">A considered space for a well-composed day.</text><rect x="281" y="320" width="158" height="42" rx="0" fill="none" stroke="#b9a571" stroke-width="1" /><text x="360.0" y="347" fill="#dfcc99" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="600" text-anchor="middle">Get started</text><line x1="91" y1="397" x2="305" y2="397" stroke="#57543d" stroke-width="1" /><path d="M 360 387 L 370 397 L 360 407 L 350 397 Z" fill="none" stroke="#b8a370" stroke-width="1" /><line x1="415" y1="397" x2="629" y2="397" stroke="#57543d" stroke-width="1" />
