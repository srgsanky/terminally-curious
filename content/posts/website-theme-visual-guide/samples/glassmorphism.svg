<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">Glassmorphism website sample</title>
<desc id="desc">Translucent overlapping panels and pale borders reveal purple-blue gradients and soft luminous shapes behind them. Original mockup for the fictional productivity product Gather.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22326d"/><stop offset=".5" stop-color="#715ba6"/><stop offset="1" stop-color="#a1bfd3"/></linearGradient><radialGradient id="orb"><stop stop-color="#dfaff5" stop-opacity=".95"/><stop offset="1" stop-color="#dfaff5" stop-opacity="0"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient></defs>
<rect x="0" y="0" width="720" height="450" rx="0" fill="url(#bg)" /><circle cx="535" cy="140" r="214" fill="url(#orb)" /><circle cx="190" cy="422" r="170" fill="#6f9fbd" opacity=".4"/><text x="38" y="47" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" >Gather</text><text x="475" y="45" fill="#ece8fa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Product</text><text x="563" y="45" fill="#ece8fa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >About</text><text x="638" y="45" fill="#ece8fa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Log in</text><text x="38" y="178" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="600" >Make room for</text><text x="38" y="227" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="600" >better work.</text><text x="38" y="265" fill="#eeebfc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >A lighter way to bring it all together.</text><rect x="38" y="296" width="142" height="42" rx="21" fill="#f4efff" /><text x="109.0" y="323" fill="#534675" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Get started</text><rect x="435" y="103" width="227" height="249" rx="20" fill="url(#glass)" stroke="#ffffff66" stroke-width="1.2" /><rect x="405" y="145" width="238" height="244" rx="20" fill="url(#glass)" stroke="#ffffff88" stroke-width="1.2" /><text x="425" y="179" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" >Your space</text><text x="425" y="203" fill="#f7f0ff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" >Everything, in a little more focus.</text><rect x="424" y="225" width="200" height="35" rx="9" fill="#fff" opacity=".28"/><circle cx="441" cy="242" r="5" fill="#e4d9fb" /><text x="455" y="247" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" >Plan something good</text><rect x="424" y="271" width="200" height="35" rx="9" fill="#fff" opacity=".20"/><circle cx="441" cy="288" r="5" fill="#e4d9fb" /><text x="455" y="293" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" >Make time to create</text><rect x="424" y="317" width="200" height="35" rx="9" fill="#fff" opacity=".15"/><circle cx="441" cy="334" r="5" fill="#e4d9fb" /><text x="455" y="339" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" >Keep the day in balance</text><text x="38" y="415" fill="#e3e8ff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" >Room for every layer of your day.</text>
</svg>
