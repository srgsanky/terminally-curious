-serif" font-size="10" font-weight="500" letter-spacing="1.3">02 — FOCUS</text><text x="466" y="395" fill="#7e8174" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" letter-spacing="1.3">03 — MAKE SPACE</text>
