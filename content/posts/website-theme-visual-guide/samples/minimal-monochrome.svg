<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">Minimal monochrome website sample</title>
<desc id="desc">White canvas, black text, thin rules, generous whitespace and a spare numbered list. Original mockup for the fictional productivity product Gather.</desc>

<rect x="0" y="0" width="720" height="450" rx="0" fill="#ffffff" /><text x="38" y="47" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" >Gather</text><text x="475" y="45" fill="#555" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Product</text><text x="563" y="45" fill="#555" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >About</text><text x="638" y="45" fill="#555" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Log in</text><line x1="38" y1="75" x2="682" y2="75" stroke="#111" stroke-width="1" /><text x="38" y="127" fill="#555" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2">SPACE TO THINK.</text><text x="38" y="189" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="500" >Make room for</text><text x="38" y="238" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="500" >better work.</text><text x="39" y="277" fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" >A clear place for the work that matters.</text><rect x="38" y="310" width="145" height="42" rx="0" fill="#222" /><text x="110.5" y="337" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Get started</text><text x="204" y="337" fill="#333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Explore the product →</text><line x1="447" y1="121" x2="447" y2="352" stroke="#ddd" stroke-width="1" /><text x="478" y="150" fill="#555" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2">YOUR DAY</text><text x="478" y="198" fill="#888" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" >01</text><text x="478" y="222" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" >Choose a priority</text><line x1="478" y1="237" x2="682" y2="237" stroke="#ddd" stroke-width="1" /><text x="478" y="259" fill="#888" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" >02</text><text x="478" y="283" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" >Give it your attention</text><line x1="478" y1="298" x2="682" y2="298" stroke="#ddd" stroke-width="1" /><text x="478" y="320" fill="#888" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" >03</text><text x="478" y="344" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" >Finish with clarity</text><line x1="478" y1="359" x2="682" y2="359" stroke="#ddd" stroke-width="1" /><line x1="38" y1="391" x2="682" y2="391" stroke="#ddd" stroke-width="1" /><text x="38" y="418" fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" >Simply enough.</text>
</svg>
