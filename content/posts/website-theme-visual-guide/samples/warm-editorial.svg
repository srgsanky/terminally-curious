<title id="title">Warm editorial website sample</title>
<desc id="desc">Warm paper, terracotta illustration, serif headlines and a magazine-like masthead. Original mockup for the fictional productivity product Gather.</desc>

<rect x="0" y="0" width="720" height="450" rx="0" fill="#f7efdf" /><text x="38" y="50" fill="#3e3027" font-family="Georgia, Times New Roman, serif" font-size="31" font-weight="400" >Gather</text><text x="493" y="45" fill="#736154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" >Journal</text><text x="577" y="45" fill="#736154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" >Our approach</text><line x1="38" y1="75" x2="682" y2="75" stroke="#806b59" stroke-width="1" /><text x="38" y="112" fill="#98583f" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">THE ART OF A GOOD WORKDAY</text><text x="38" y="183" fill="#3e3027" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="400" >Make room for</text><text x="38" y="233" fill="#3e3027" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="400" >better work.</text><text x="38" y="274" fill="#736154" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="400" >Notes, plans and space to think.</text><rect x="38" y="307" width="144" height="42" rx="0" fill="#a95135" /><text x="110.0" y="334" fill="#fff" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="600" text-anchor="middle">Get started</text><rect x="438" y="108" width="244" height="272" rx="0" fill="#bd684b" /><path d="M 438 380 L 438 247 Q 472 211 526 229 Q 597 248 682 158 L 682 380 Z" fill="#d39371" /><path d="M 438 380 L 438 314 Q 538 252 604 292 Q 643 314 682 274 L 682 380 Z" fill="#e5b798" /><circle cx="595" cy="165" r="31" fill="#f0c9a0" /><text x="457" y="349" fill="#fff0dc" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="400" >A little perspective.</text><line x1="38" y1="400" x2="682" y2="400" stroke="#bfb19e" stroke-width="1" /><text x="38" y="425" fill="#806b59" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" letter-spacing="1.5">VOL. 01 / WORK, WITH INTENTION</text>
