<title id="title">Neobrutalism website sample</title>
<desc id="desc">Vivid yellow and pink, thick black outlines, oversized bold type and unblurred offset shadows. Original mockup for the fictional productivity product Gather.</desc>

<rect x="0" y="0" width="720" height="450" rx="0" fill="#ffe44d" /><text x="31" y="48" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" >Gather!</text><text x="454" y="45" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" >THE PRODUCT</text><text x="581" y="45" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" >SAY HELLO ↗</text><line x1="0" y1="76" x2="720" y2="76" stroke="#161616" stroke-width="3" /><rect x="36" y="105" width="183" height="28" rx="0" fill="#fff" stroke="#161616" stroke-width="2" /><text x="127" y="125" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BIG IDEAS NEED SPACE</text><text x="31" y="191" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" >Make room for</text><text x="31" y="240" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" >better work.</text><text x="32" y="280" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" >Do the good stuff. Lose the busywork.</text><rect x="39" y="318" width="151" height="44" rx="0" fill="#161616" /><rect x="32" y="311" width="151" height="44" rx="0" fill="#fff" stroke="#161616" stroke-width="3" /><text x="107" y="339" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Get started ↗</text><rect x="439" y="131" width="240" height="239" rx="0" fill="#161616" /><rect x="430" y="122" width="240" height="239" rx="0" fill="#f591ca" stroke="#161616" stroke-width="3" /><text x="448" y="157" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" >YOUR NEXT BIG THING</text><line x1="430" y1="175" x2="670" y2="175" stroke="#161616" stroke-width="3" /><rect x="448" y="191" width="202" height="35" rx="0" fill="#a7d9ff" stroke="#161616" stroke-width="2" /><text x="460" y="214" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" >MAKE A PLAN</text><rect x="448" y="241" width="202" height="35" rx="0" fill="#c6f18c" stroke="#161616" stroke-width="2" /><text x="460" y="264" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" >TRY SOMETHING</text><rect x="448" y="291" width="202" height="35" rx="0" fill="#fff" stroke="#161616" stroke-width="2" /><text x="460" y="314" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" >SHIP THE THING</text><text x="32" y="419" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" letter-spacing="1">LESS POLISH. MORE POSSIBILITY.</text>
