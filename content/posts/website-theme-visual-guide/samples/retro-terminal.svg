<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">Retro terminal website sample</title>
<desc id="desc">A dark terminal window with green monospace type, shell prompts, command output and a block cursor. Original mockup for the fictional productivity product Gather.</desc>

<rect x="0" y="0" width="720" height="450" rx="0" fill="#0c110e" /><rect x="16" y="16" width="688" height="418" rx="8" fill="#0c110e" stroke="#395445" stroke-width="1" /><rect x="16" y="16" width="688" height="37" rx="8" fill="#1d2a22" /><circle cx="37" cy="35" r="5" fill="#bb7569" /><circle cx="55" cy="35" r="5" fill="#bca36a" /><circle cx="73" cy="35" r="5" fill="#779f77" /><text x="360" y="40" fill="#a7bcac" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle">gather — workspace</text><text x="39" y="91" fill="#8ad99d" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" >visitor@gather:~ $ gather --welcome</text><text x="39" y="139" fill="#d3e5cc" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="600" >GATHER / A LITTLE MORE FOCUS</text><text x="39" y="197" fill="#b6e9a7" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="600" >Make room for</text><text x="39" y="241" fill="#b6e9a7" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="600" >better work.</text><text x="39" y="281" fill="#85ad86" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="400" >&gt; Less busywork. More breathing room.</text><text x="39" y="323" fill="#85ad86" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="400" >[✓] plans     [✓] projects     [✓] people</text><rect x="39" y="350" width="206" height="40" rx="0" fill="#b6e9a7" /><text x="56" y="376" fill="#142114" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="600" >$ Get started</text><text x="39" y="417" fill="#85ad86" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="400" >visitor@gather:~ $</text><rect x="219" y="404" width="9" height="17" rx="0" fill="#b6e9a7" />
</svg>
