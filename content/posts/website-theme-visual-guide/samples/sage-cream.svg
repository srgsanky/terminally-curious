<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">Sage &amp; cream website sample</title>
<desc id="desc">Warm ivory, muted sage green, soft pill buttons and a paper-like daily planner. Original mockup for the fictional productivity product Gather.</desc>

<rect x="0" y="0" width="720" height="450" rx="0" fill="#f6f4e9" /><text x="38" y="47" fill="#304b39" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" >Gather</text><text x="475" y="45" fill="#5e6f59" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Product</text><text x="563" y="45" fill="#5e6f59" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >About</text><text x="638" y="45" fill="#5e6f59" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Log in</text><line x1="38" y1="75" x2="682" y2="75" stroke="#d9decc" stroke-width="1" /><rect x="38" y="108" width="166" height="29" rx="15" fill="#e4ead9" /><text x="121" y="128" fill="#445b42" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="middle">A calmer workday</text><text x="38" y="193" fill="#304b39" font-family="Georgia, Times New Roman, serif" font-size="43" font-weight="400" >Make room for</text><text x="38" y="242" fill="#304b39" font-family="Georgia, Times New Roman, serif" font-size="43" font-weight="400" >better work.</text><text x="39" y="282" fill="#63705e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" >Less noise. More meaningful progress.</text><rect x="38" y="311" width="139" height="42" rx="22" fill="#617c5a" /><text x="107.5" y="338" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Get started</text><rect x="418" y="126" width="264" height="250" rx="18" fill="#edf0e4" stroke="#d5ddcb" stroke-width="1" /><rect x="438" y="145" width="224" height="211" rx="10" fill="#fffdf5" stroke="#d9decd" stroke-width="1" /><text x="456" y="178" fill="#354d38" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" >Today, gently.</text><text x="456" y="203" fill="#6a7862" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" >WEDNESDAY / YOUR FOCUS</text><rect x="456" y="219" width="15" height="15" rx="4" fill="#829775" stroke="#829775" stroke-width="1" /><text x="483" y="233" fill="#53644c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" >Plan the next chapter</text><path d="M 460 226 l 3 3 l 5 -6" fill="none" stroke="#fff" stroke-width="2" /><rect x="456" y="260" width="15" height="15" rx="4" fill="#829775" stroke="#829775" stroke-width="1" /><text x="483" y="274" fill="#53644c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" >Make space to create</text><path d="M 460 267 l 3 3 l 5 -6" fill="none" stroke="#fff" stroke-width="2" /><rect x="456" y="301" width="15" height="15" rx="4" fill="#fffdf5" stroke="#829775" stroke-width="1" /><text x="483" y="315" fill="#53644c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" >Take a real break</text><text x="38" y="411" fill="#6b7861" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" >Thoughtful tools for everyday work.</text>
</svg>
